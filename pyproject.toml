[project]
name = "EasyLocomo"
version = "0.1.0"
description = "A repo for easy interaction with locomo benchmark"
authors = [
    {name = "playeriv65", email = "playeriv65@gmail.com"},
]
dependencies = [
    "openai>=1.0.0",
    "numpy",
    "tqdm",
    "types-tqdm",
    "tiktoken",
    "regex",
    "nltk",
    "dotenv",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["locomo*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
